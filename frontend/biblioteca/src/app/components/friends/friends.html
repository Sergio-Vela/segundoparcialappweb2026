<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <ng-container matColumnDef="table">
    <th mat-header-cell *matHeaderCellDef>Tabla</th>
    <td mat-cell *matCellDef="let element">{{ element.table_name }}</td>
  </ng-container>

  <ng-container matColumnDef="old">
    <th mat-header-cell *matHeaderCellDef>Antes</th>
    <td mat-cell *matCellDef="let element">
      {{ element.old_value.name }}
    </td>
  </ng-container>

  <ng-container matColumnDef="new">
    <th mat-header-cell *matHeaderCellDef>Después</th>
    <td mat-cell *matCellDef="let element">
      {{ element.new_value.name }}
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<div *ngIf="changes.length === 0">
  <p>No hay cambios recibidos todavía.</p>
</div>
