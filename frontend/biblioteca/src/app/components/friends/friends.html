<mat-card class="amigos" appearance="outlined">
  <mat-card-header>
    <mat-card-title>My Friends</mat-card-title>
    <mat-card-subtitle>Amigos que cambiaron nombre</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 mi-tabla">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef class="mi-header">ID</th>
        <td mat-cell *matCellDef="let element">{{ element.old_value.id }}</td>
      </ng-container>


      <ng-container matColumnDef="new">
        <th mat-header-cell *matHeaderCellDef class="mi-header">Nuevo Nombre</th>
        <td mat-cell *matCellDef="let element">
          {{ element.new_value.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="old">
        <th mat-header-cell *matHeaderCellDef class="mi-header">Antiguo Nombre</th>
        <td mat-cell *matCellDef="let element">
          {{ element.old_value.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="table">
        <th mat-header-cell *matHeaderCellDef class="mi-header">Tabla</th>
        <td mat-cell *matCellDef="let element">{{ element.table_name }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="mi-row"></tr>
    </table>

    <div *ngIf="changes.length === 0">
      <p>No hay cambios recibidos todavía.</p>
    </div>
  </mat-card-content>
</mat-card>
